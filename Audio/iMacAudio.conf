context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            "node.description": "iMac Speakers",
            "media.name": "iMac Speakers",
            "filter.graph": {
                "nodes": [
                    {
                        "type": "lv2",
                        "plugin": "https://chadmed.au/bankstown",
                        "name": "bassex",
                        "control": {
                            "bypass": 0, "amt": 1, "sat_second": 1, "sat_third": 1,
                            "blend": 1.0, "ceil": 100.0, "floor": 20.0, "final_hp": 100.0
                        }
                    },
                    {
                        "type": "lv2",
                        "plugin": "http://lsp-plug.in/plugins/lv2/loud_comp_mono",
                        "name": "ell",
                        "control": { "enabled": 1, "input": 1.0, "fft": 2 }
                    },
                    {
                        "type": "lv2",
                        "plugin": "http://lsp-plug.in/plugins/lv2/loud_comp_mono",
                        "name": "elr",
                        "control": { "enabled": 1, "input": 1.0, "fft": 2 }
                    },
                    
                    # --- MASTER EQ: 850 Hz BOOST (Midrange Warmth) ---
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "master_boost850_l", 
                        "control": { "Freq": 880, "Q": 1.2, "Gain": 1.0 } 
                    },
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "master_boost850_r", 
                        "control": { "Freq": 880, "Q": 1.2, "Gain": 1.0 } 
                    },

                    # --- MASTER EQ (Pre-Crossover) ---
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "master_notch3k5_l", 
                        "control": { "Freq": 3500, "Q": 2.0, "Gain": -3.0 } 
                    },
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "master_notch3k5_r", 
                        "control": { "Freq": 3500, "Q": 2.0, "Gain": -3.0 } 
                    },
                    
                    # --- CROSSOVER STAGE 1 (12dB/octave) ---
                    { "type": "builtin", "label": "bq_highpass", "name": "xo_hp1_l", "control": { "Freq": 3800 } },
                    { "type": "builtin", "label": "bq_highpass", "name": "xo_hp1_r", "control": { "Freq": 3800 } },
                    { "type": "builtin", "label": "bq_lowpass",  "name": "xo_lp1_l", "control": { "Freq": 3800 } },
                    { "type": "builtin", "label": "bq_lowpass",  "name": "xo_lp1_r", "control": { "Freq": 3800 } },

                    # --- CROSSOVER STAGE 2 (+12dB = 24dB/octave LR4) ---
                    { "type": "builtin", "label": "bq_highpass", "name": "xo_hp2_l", "control": { "Freq": 3800 } },
                    { "type": "builtin", "label": "bq_highpass", "name": "xo_hp2_r", "control": { "Freq": 3800 } },
                    { "type": "builtin", "label": "bq_lowpass",  "name": "xo_lp2_l", "control": { "Freq": 3800 } },
                    { "type": "builtin", "label": "bq_lowpass",  "name": "xo_lp2_r", "control": { "Freq": 3800 } },

                    # --- TWEETER EQ (Post-Crossover) ---
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "tw_boost5k_l", 
                        "control": { "Freq": 5250, "Q": 1.5, "Gain": 3.0 } 
                    },
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "tw_boost5k_r", 
                        "control": { "Freq": 5250, "Q": 1.5, "Gain": 3.0 } 
                    },
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "tw_notch8k5_l", 
                        "control": { "Freq": 8400, "Q": 2.0, "Gain": -3.0 } 
                    },
                    { 
                        "type": "builtin", "label": "bq_peaking", "name": "tw_notch8k5_r", 
                        "control": { "Freq": 8400, "Q": 2.0, "Gain": -3.0 } 
                    },

                    {
                        "type": "builtin",
                        "label": "convolver",
                        "name": "convLT",
                        "config": {
                            "filename": [ "/usr/share/imac-audio/Filters L Aug 14-MP.wav" ],
                            "channel": 0, "gain": 1.0
                        }
                    },
                    {
                        "type": "builtin",
                        "label": "convolver",
                        "name": "convRT",
                        "config": {
                            "filename": [ "/usr/share/imac-audio/Filters R Aug 14-MP.wav" ],
                            "channel": 0, "gain": 1.0
                        }
                    },
                    {
                        "type": "builtin",
                        "label": "convolver",
                        "name": "convLW",
                        "config": {
                            "filename": [ "/usr/share/imac-audio/Filters C2 Aug 16-MP.wav" ],
                            "channel": 0, "gain": 0.40
                        }
                    },
                    {
                        "type": "builtin",
                        "label": "convolver",
                        "name": "convRW",
                        "config": {
                            "filename": [ "/usr/share/imac-audio/Filters LFE Aug 16-MP.wav" ],
                            "channel": 0, "gain": 0.40
                        }
                    },
                    {
                        "type": "lv2",
                        "plugin": "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo",
                        "name": "woofer_bp",
                        "control": {
                            "bypass": 0, "mode": 0, "ce_0": 1, "sla_0": 5.0, "cr_0": 1.5,
                            "al_0": 0.850, "at_0": 15.0, "rt_0": 120, "kn_0": 0.125,
                            "cbe_1": 1, "sf_1": 300.0, "ce_1": 0, "cbe_2": 0, "ce_2": 0,
                            "cbe_3": 0, "ce_3": 0, "cbe_4": 0, "ce_4": 0, "cbe_5": 0,
                            "ce_5": 0, "cbe_6": 0, "ce_6": 0
                        }
                    },
                    {
                        "type": "lv2",
                        "plugin": "http://lsp-plug.in/plugins/lv2/compressor_stereo",
                        "name": "woofer_lim",
                        "control": {
                            "bypass": 0, "sla": 5.0, "al": 1.0, "at": 1.0, "rt": 100.0,
                            "cr": 15.0, "kn": 0.5
                        }
                    }
                ],
                "links": [
                    {"output": "bassex:out_l", "input": "ell:in"},
                    {"output": "bassex:out_r", "input": "elr:in"},
                    
                    # --- ROUTE COMPRESSORS TO 850 Hz BOOST ---
                    {"output": "ell:out", "input": "master_boost850_l:In"},
                    {"output": "elr:out", "input": "master_boost850_r:In"},
                    
                    # --- ROUTE 850 Hz BOOST TO 3.5 kHz NOTCH ---
                    {"output": "master_boost850_l:Out", "input": "master_notch3k5_l:In"},
                    {"output": "master_boost850_r:Out", "input": "master_notch3k5_r:In"},

                    # --- ROUTE 3.5 kHz NOTCH TO CROSSOVER STAGE 1 ---
                    {"output": "master_notch3k5_l:Out", "input": "xo_hp1_l:In"},
                    {"output": "master_notch3k5_l:Out", "input": "xo_lp1_l:In"},
                    {"output": "master_notch3k5_r:Out", "input": "xo_hp1_r:In"},
                    {"output": "master_notch3k5_r:Out", "input": "xo_lp1_r:In"},

                    # --- CASCADE STAGE 1 INTO STAGE 2 ---
                    {"output": "xo_hp1_l:Out", "input": "xo_hp2_l:In"},
                    {"output": "xo_hp1_r:Out", "input": "xo_hp2_r:In"},
                    {"output": "xo_lp1_l:Out", "input": "xo_lp2_l:In"},
                    {"output": "xo_lp1_r:Out", "input": "xo_lp2_r:In"},
                    
                    # --- ROUTE HIGHS FROM CROSSOVER INTO TWEETER EQ ---
                    {"output": "xo_hp2_l:Out", "input": "tw_boost5k_l:In"},
                    {"output": "xo_hp2_r:Out", "input": "tw_boost5k_r:In"},
                    
                    {"output": "tw_boost5k_l:Out", "input": "tw_notch8k5_l:In"},
                    {"output": "tw_boost5k_r:Out", "input": "tw_notch8k5_r:In"},

                    # --- ROUTE TWEETER EQ TO CONVOLVERS ---
                    {"output": "tw_notch8k5_l:Out", "input": "convLT:In"},
                    {"output": "tw_notch8k5_r:Out", "input": "convRT:In"},
                    
                    # --- ROUTE LOWS TO WOOFER CONVOLVERS ---
                    {"output": "xo_lp2_l:Out", "input": "convLW:In"},
                    {"output": "xo_lp2_r:Out", "input": "convRW:In"},
                    
                    {"output": "convLW:Out", "input": "woofer_bp:in_l"},
                    {"output": "convRW:Out", "input": "woofer_bp:in_r"},
                    {"output": "woofer_bp:out_l", "input": "woofer_lim:in_l"},
                    {"output": "woofer_bp:out_r", "input": "woofer_lim:in_r"}
                ],
                "inputs": [ "bassex:in_l", "bassex:in_r" ],
                
                # Maps convLT/convRT to Tweeters (FL/FR) and woofer_lim to Woofers (RL/RR)
                "outputs": [ "convLT:Out", "convRT:Out", "woofer_lim:out_l", "woofer_lim:out_r" ],
                
                "capture.volumes": [
                    { "control": "ell:volume", "min": -47.5, "max": 0.0, "scale": "cubic" },
                    { "control": "elr:volume", "min": -47.5, "max": 0.0, "scale": "cubic" }
                ]
            },
            "capture.props": {
                "node.name": "audio_effect.iMac-convolver",
                "media.class": "Audio/Sink",
                "audio.channels": "2",
                "audio.position": ["FL", "FR"],
                "audio.allowed-rates": [48000],
                "device.api": "dsp",
                "node.virtual": "false",
                "priority.session": 850,
                "state.default-volume": 0.343,
                "device.icon-name": "audio-speakers"
            },
            "playback.props": {
                "node.name": "effect_output.iMac-convolver",
                "node.description": "iMac Speakers DSP Out",
                "media.name": "iMac Speakers DSP Out",
                "node.dont-fallback": "true",
                "node.passive": "true",
                "audio.channels": "4",
                "audio.allowed-rates": [48000],
                "audio.position": ["FL", "FR", "RL", "RR"]
            }
        }
    }
]
